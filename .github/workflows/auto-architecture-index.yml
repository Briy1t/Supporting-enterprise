name: Auto Architecture Index

on:
  push:
    paths:
      - "docs/architecture/**"

jobs:
  generate-architecture-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      - name: Generar ARCHITECTURE_SUMMARY.md
        run: |
          echo "# Architecture Summary" > docs/architecture/ARCHITECTURE_SUMMARY.md
          echo "" >> docs/architecture/ARCHITECTURE_SUMMARY.md

          for folder in docs/architecture/*; do
            if [ -d "$folder" ]; then
              foldername=$(basename "$folder")
              echo "## $foldername" >> docs/architecture/ARCHITECTURE_SUMMARY.md

              for file in $folder/*.md; do
                filename=$(basename "$file")
                echo "- [$filename]($foldername/$filename)" >> docs/architecture/ARCHITECTURE_SUMMARY.md
              done

              echo "" >> docs/architecture/ARCHITECTURE_SUMMARY.md
            fi
          done

          echo "## Archivos en la raíz" >> docs/architecture/ARCHITECTURE_SUMMARY.md
          for file in docs/architecture/*.md; do
            filename=$(basename "$file")
            echo "- [$filename]($filename)" >> docs/architecture/ARCHITECTURE_SUMMARY.md
          done

      - name: Commit automático del índice de arquitectura
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/architecture/ARCHITECTURE_SUMMARY.md

          if git diff-index --quiet HEAD; then
            echo "No hay cambios en architecture."
          else
            git commit -m "docs: actualización automática de ARCHITECTURE_SUMMARY.md"
            git push origin HEAD:${{ github.ref }}
          fi
