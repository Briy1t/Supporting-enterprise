name: Auto Changelog Index

on:
  push:
    paths:
      - "docs/changelog/**"

jobs:
  generate-changelog-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      - name: Generar LATEST.md
        run: |
          echo "# Latest Changelog" > docs/changelog/LATEST.md
          echo "" >> docs/changelog/LATEST.md

          YEAR=$(date +'%Y')
          MONTH=$(date +'%m')
          FOLDER="docs/changelog/$YEAR-$MONTH"

          if [ -d "$FOLDER" ]; then
            for file in $FOLDER/*.md; do
              filename=$(basename "$file")
              echo "- [$filename]($YEAR-$MONTH/$filename)" >> docs/changelog/LATEST.md
            done
          else
            echo "No hay cambios este mes." >> docs/changelog/LATEST.md
          fi

      - name: Commit automático del índice de changelog
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/changelog/LATEST.md

          if git diff-index --quiet HEAD; then
            echo "No hay cambios en changelog."
          else
            git commit -m "docs: actualización automática de LATEST.md"
            git push origin HEAD:${{ github.ref }}
          fi
